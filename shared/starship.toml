# Starship prompt config — https://starship.rs/config/
# Symlinked to ~/.config/starship.toml by terminal_setup.sh
#
# Minimal config: directory + git + prompt character. Nothing else.
# Re-enable language/cloud/k8s modules below as you decide you want them.

add_newline = true
format = """
$directory$git_branch$git_status
$character"""
