# Starship prompt config — https://starship.rs/config/
# Symlinked to ~/.config/starship.toml by terminal_setup.sh

add_newline = true
palette = "catppuccin_mocha"
# Show kubernetes context on every prompt (default: disabled)
[kubernetes]
disabled = false
format = '[$symbol$context( \($namespace\))]($style) '

# Show AWS only when a profile is actively set (region hidden — too noisy)
[aws]
format = '[($symbol$profile )]($style)'

# Hide docker context — OrbStack always shows otherwise
[docker_context]
disabled = true

# Show GCP account / project when configured
[gcloud]
format = '[$symbol$account(@$domain)(\($project\))]($style) '

# Terraform workspace when in a TF directory
[terraform]
format = '[$symbol$workspace]($style) '

# Catppuccin Mocha palette (from github.com/catppuccin/starship)
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
